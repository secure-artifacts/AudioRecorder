name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(.+)$') {
            throw "Tag must start with v."
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri MSI
        run: npm run tauri:build

      - name: Collect release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw "MSI build output was not found."
          }

          $assetPath = Join-Path $dist "AudioRecorder_V$version`_windows_x64.msi"
          Copy-Item -LiteralPath $msi.FullName -Destination $assetPath -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $assetPath)" } |
            Set-Content -Path (Join-Path $dist "AudioRecorder_V$version`_windows_x64.sha256") -Encoding UTF8

      - name: Validate release assets
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ExpectedVersion "${{ steps.version.outputs.version }}" -PackagePath "dist"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
